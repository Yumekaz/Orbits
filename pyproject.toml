[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbits-codebase"
version = "0.1.2"
description = "Codebase map, dependency graph analyzer, and cleanup-confidence engine."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Orbits contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
orbits = "analyzer:main"

[tool.setuptools]
py-modules = [
  "analyzer",
  "benchmark_graph",
  "cache",
  "cleanup_plan",
  "codebase_map",
  "crawler",
  "entrypoints",
  "git_intel",
  "graph_diff",
  "graph_engine",
  "lang_dispatch",
  "orbits",
  "path_utils",
  "resolver",
  "runtime_env",
  "runtime_trace",
  "scale_proof",
  "worker",
]
include-package-data = true

[tool.setuptools.packages.find]
include = ["extractors", "extractors.*", "resolvers", "resolvers.*", "orbits_assets"]
exclude = ["tests*", "test_repo*", "e2e*"]

[tool.setuptools.package-data]
orbits_assets = ["visualizer.html", "visualizer_app.js", "visualizer_worker.js", "visualizer.css"]
