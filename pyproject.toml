[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbits-codebase"
version = "0.1.0"
description = "Multi-language codebase dependency graph analyzer and dead-code detector."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Orbits contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
orbits = "analyzer:main"

[tool.setuptools]
py-modules = [
  "analyzer",
  "benchmark_graph",
  "cache",
  "crawler",
  "entrypoints",
  "git_intel",
  "graph_diff",
  "graph_engine",
  "lang_dispatch",
  "path_utils",
  "resolver",
  "runtime_env",
  "runtime_trace",
  "worker",
]
include-package-data = false

[tool.setuptools.packages.find]
include = ["extractors", "extractors.*", "resolvers", "resolvers.*"]
exclude = ["tests*", "test_repo*", "e2e*"]
